name: Build and Release Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle + wrapper + build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up release keystore
        id: keystore
        run: |
          mkdir -p $HOME/.android
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/.android/release.jks
            echo "keystore_file=$HOME/.android/release.jks" >> $GITHUB_OUTPUT
            echo "keystore_alias=${{ secrets.KEYSTORE_ALIAS }}" >> $GITHUB_OUTPUT
          else
            keytool -genkey -v -keystore $HOME/.android/release.jks \
              -storepass android -alias truehub -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TrueHub,O=TrueHub,C=US"
            echo "keystore_file=$HOME/.android/release.jks" >> $GITHUB_OUTPUT
            echo "keystore_alias=truehub" >> $GITHUB_OUTPUT
          fi

      - name: Build release APKs (per-ABI)
        run: ./gradlew --build-cache assembleGithubRelease -PabiSplits=true --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError"

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Sign and rename APKs by ABI
        id: apks
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          KS="${{ steps.keystore.outputs.keystore_file }}"
          ALIAS="${{ steps.keystore.outputs.keystore_alias }}"
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD || 'android' }}"
          KEY_PASS="${STORE_PASS}"

          mkdir -p dist
          # Map ABI -> friendly arch suffix
          declare -A arch=( [armeabi-v7a]=armv7a [arm64-v8a]=arm64 [x86_64]=x86_64 )
          for apk in app/build/outputs/apk/github/release/*-release-unsigned.apk; do
            base=$(basename "$apk" -release-unsigned.apk)
            abi="${base#app-github-}"
            suffix="${arch[$abi]:-$abi}"
            out="dist/truehub-$VERSION-$suffix.apk"
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks "$KS" --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
              --out "$out" "$apk"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify "$out"
            echo "$out" >> /tmp/assets.txt
          done

      - name: Create Release with APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSETS=$(paste -sd ' ' /tmp/assets.txt)
          cat > release_body.md << EOF
          ## 📱 TrueHub $VERSION
          ### 📦 Download
          Choose the APK matching your device architecture (ARM64 for most modern phones).
          - **armv7a** — older 32-bit ARM devices
          - **arm64** — most modern 64-bit devices
          - **x86_64** — 64-bit emulators / x86 devices
          ### ⚠️ Installing a New Version
          - APKs are signed with a release certificate.
          - If your previously installed build used a different certificate, uninstall it first.
          ### 🔧 Build Info
          - Commit: ${{ github.sha }}
          EOF
          gh release create "$VERSION" $ASSETS \
            --title "Release $VERSION" \
            --notes-file release_body.md \
            --prerelease=false

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: truehub-${{ steps.version.outputs.version }}
          path: dist/*.apk
          retention-days: 30

  build-unsigned:
    name: Build Unsigned Release APKs (Dev)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle + wrapper + build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APKs
        run: ./gradlew --build-cache assembleGithubRelease -PabiSplits=true --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError"

      - name: Upload unsigned APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk-release
          path: app/build/outputs/apk/github/release/*-release-unsigned.apk
          retention-days: 7
